<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>open-alive</title>
  <rect width="32" height="32" rx="7" fill="#0d1117"/>
  <!-- open ring: a circle left open at the top-right -->
  <path d="M25.4 12.6 A10 10 0 1 1 21 7.3" fill="none" stroke="#58a6ff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- pulse line running through the ring -->
  <path d="M8.5 16.5 H12.5 L14.2 12 L17 21 L18.8 16.5 H23.5" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the live dot sitting in the opening -->
  <circle cx="24.1" cy="9.2" r="1.9" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
