name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Only the canonical repository runs CI; forks and mirrors must not spend their own runner minutes.
    if: github.repository == 'hwiery/open-alive'
    runs-on: ${{ matrix.os }}
    strategy:
      # One flaky job (a native-module crash seen on Node 24) must not cancel the rest of the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm --filter=@open-alive/ui exec tsc --noEmit

      - name: Test
        run: pnpm test

  security-audit:
    if: github.repository == 'hwiery/open-alive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit
